<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>데이터 검증</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"><style>
:root{--bg:#0b0e11;--panel:#12161c;--line:#1f2530;--line2:#2a3140;--text:#e8eaed;--muted:#6b7684;--up:#72d6a5;--bad:#ff7b84;--warn:#e6c36a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace}header{padding:24px 32px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;align-items:center;position:sticky;top:0;background:rgba(11,14,17,.94);backdrop-filter:blur(8px);z-index:3}h1{font:700 22px 'Space Grotesk',sans-serif;margin:0}.links{display:flex;gap:8px}.btn{color:var(--text);text-decoration:none;border:1px solid var(--line2);padding:7px 10px;border-radius:6px;font-size:10px}.wrap{max-width:1280px;margin:auto;padding:24px 28px 70px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{border:1px solid var(--line);border-radius:7px;padding:11px}.metric span{display:block;color:var(--muted);font-size:9px;margin-bottom:6px}.metric strong{font-size:14px}.small{font-size:9px;color:var(--muted);line-height:1.6}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:10px}.table th,.table td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{color:var(--muted);font-weight:500}.ok{color:var(--up)}.bad{color:var(--bad)}.warn{color:var(--warn)}.row-bad{background:rgba(255,123,132,.035)}.row-ok{background:rgba(114,214,165,.02)}.title{font:700 13px 'Space Grotesk',sans-serif;margin-bottom:10px}.back{color:var(--muted);font-size:10px;text-decoration:none}@media(max-width:800px){header{padding:18px 16px}.wrap{padding:18px 14px 60px}.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><h1><span style="display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:999px;background:#202733;border:1px solid #3a4658;font-size:10px;margin-right:6px">⑥</span>데이터 검증</h1><div class="links"><a class="btn" href="index.html">← 관심종목</a></div></header><main class="wrap"><a class="back" href="index.html">← 관심종목으로 돌아가기</a><div id="app" style="margin-top:14px">불러오는 중…</div></main><script>
const app=document.getElementById('app');
function n(v){return v==null||v===''||!Number.isFinite(Number(v))?'-':Number(v).toLocaleString('ko-KR')}
function hasNum(v){return v!==null&&v!==undefined&&v!==''&&Number.isFinite(Number(v))}
function okBadge(label='정상'){return `<span class="ok">🟢 ${label}</span>`}
function failBadge(label='수집 실패'){return `<span class="bad">🔴 ${label}</span>`}
function warnBadge(label='확인 필요'){return `<span class="warn">🟡 ${label}</span>`}
function flowState(x,stock){
  const f=x.flow||{}; const has=hasNum(stock?.foreignNet)||hasNum(stock?.instNet);
  if(has) return okBadge('정상');
  if(f.status==='blocked') return warnBadge('인증 필요');
  return failBadge();
}
function financeState(x){
  const f=x.financial||{};
  if(f.status==='ok' || (hasNum(x.roe)&&hasNum(x.debtRatio))) return okBadge('정상');
  if(f.status==='partial' || hasNum(x.roe)||hasNum(x.debtRatio)) return warnBadge('부분 확보');
  return failBadge();
}
function shortState(x,stock){
  const sh=x.short||{}; const has=hasNum(stock?.shortSellingRatio);
  if(has && (sh.status==='ok'||sh.status==null)) return okBadge('정상');
  if(sh.status==='blocked') return warnBadge('KRX 인증 필요');
  if(has) return okBadge('정상');
  return failBadge();
}
function validationReady(x,stock){
  const flow=hasNum(stock?.foreignNet)||hasNum(stock?.instNet);
  const fin=hasNum(stock?.roe)&&hasNum(stock?.debtRatio);
  const sh=hasNum(stock?.shortSellingRatio);
  return flow&&fin&&sh;
}
async function load(){
  const [vr,sr]=await Promise.all([
    fetch('data/validation.json?ts='+Date.now()),
    fetch('data/stocks.json?ts='+Date.now())
  ]);
  const v=vr.ok?await vr.json():null;
  const st=sr.ok?await sr.json():{stocks:[]};
  if(!v){app.innerHTML='<div class="card"><b class="bad">validation.json이 없습니다.</b><div class="small">GitHub Actions가 새 버전의 scraper.py를 실행한 뒤 생성됩니다.</div></div>';return}
  const stocks=st.stocks||[]; const byCode=Object.fromEntries(stocks.map(s=>[s.code,s]));
  const rows=v.stocks||[]; const total=v.universe||stocks.length; const sd=v.shortSellingBatch||{};
  const flowCount=stocks.filter(s=>hasNum(s.foreignNet)||hasNum(s.instNet)).length;
  const finCount=stocks.filter(s=>hasNum(s.roe)&&hasNum(s.debtRatio)).length;
  const shortCount=stocks.filter(s=>hasNum(s.shortSellingRatio)).length;
  const readyCount=stocks.filter(s=>validationReady(null,s)).length;
  app.innerHTML=`
  <div class="card"><div class="title">전체 수집 상태</div><div class="grid">
    <div class="metric"><span>종목</span><strong>${total}개</strong></div>
    <div class="metric"><span>수급</span><strong class="${flowCount===total?'ok':'bad'}">${flowCount}/${total}</strong></div>
    <div class="metric"><span>재무</span><strong class="${finCount===total?'ok':'bad'}">${finCount}/${total}</strong></div>
    <div class="metric"><span>공매도</span><strong class="${shortCount===total?'ok':'bad'}">${shortCount}/${total}</strong></div>
  </div><p class="small" style="margin-top:10px">업데이트: ${v.updatedAt||st.updatedAt||'-'} · 검증완료: ${readyCount}/${total}</p>
  ${sd.status==='blocked'?'<div class="small warn" style="margin-top:8px">⚠️ 공매도: '+(sd.message||'KRX 로그인 인증정보가 필요합니다.')+'</div>':''}</div>
  <div class="card"><div class="title">35개 종목 개별 검증</div><div class="table-wrap"><table class="table"><thead><tr><th>종목</th><th>수급</th><th>외국인</th><th>기관</th><th>재무</th><th>ROE</th><th>부채비율</th><th>공매도</th><th>공매도 기준일</th><th>판정</th></tr></thead><tbody>
  ${rows.map(x=>{const s=byCode[x.code]||{}; const ready=validationReady(x,s); const fin=x.financial||{}; const flow=x.flow||{}; const sh=x.short||{}; return `<tr class="${ready?'row-ok':'row-bad'}">
    <td><b>${x.name||s.name||'-'}</b><br><span class="small">${x.code||'-'}</span></td>
    <td>${flowState(x,s)}<br><span class="small">${flow.source||((hasNum(s.foreignNet)||hasNum(s.instNet))?'Naver 투자자별 매매동향':'-')}</span></td>
    <td>${n(s.foreignNet)}<br><span class="small">${flow.date||'-'}</span></td>
    <td>${n(s.instNet)}<br><span class="small">${flow.date||'-'}</span></td>
    <td>${financeState(x)}<br><span class="small">${fin.period||s.financialPeriod||'-'}${fin.method?' · '+fin.method:''}</span></td>
    <td>${hasNum(s.roe)?Number(s.roe).toFixed(2)+'%':'-'}</td>
    <td>${hasNum(s.debtRatio)?Number(s.debtRatio).toFixed(2)+'%':'-'}</td>
    <td>${shortState(x,s)}<br>${hasNum(s.shortSellingRatio)?Number(s.shortSellingRatio).toFixed(2)+'%':'-'}</td>
    <td>${sh.date||s.shortSellingDate||'-'}</td>
    <td>${ready?okBadge('검증완료'):(sd.status==='blocked'&&!hasNum(s.shortSellingRatio)?warnBadge('공매도 인증 필요'):'<span class="bad">🔴 검증필요</span>')}</td>
  </tr>`}).join('')}</tbody></table></div></div>
  <div class="card"><div class="title">검증 정책</div><div class="small">${v.policy||''}<br>• 수급: 외국인 또는 기관 순매매 값이 실제로 있으면 정상이며, 값이 0이더라도 정상 데이터로 취급합니다.<br>• 재무: ROE와 부채비율이 모두 확보되면 정상입니다. 한쪽만 있으면 부분 확보로 표시합니다.<br>• 공매도: 0.00%도 실제 KRX 값이면 정상입니다. 값 없음과 KRX 인증 필요를 구분합니다.<br>• 기존 버전 데이터의 재사용 여부와 관계없이 현재 stocks.json에 존재하는 실제 값과 수집 상태를 기준으로 표시합니다.</div></div>`;
}
load().catch(e=>{console.error(e);app.innerHTML='<div class="card"><span class="bad">검증 데이터를 불러오지 못했습니다.</span></div>'});
</script></body></html>
