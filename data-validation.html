<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>데이터 검증</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"><style>
:root{--bg:#0b0e11;--panel:#12161c;--line:#1f2530;--line2:#2a3140;--text:#e8eaed;--muted:#6b7684;--up:#72d6a5;--bad:#ff7b84;--warn:#e6c36a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace}header{padding:24px 32px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;align-items:center;position:sticky;top:0;background:rgba(11,14,17,.94);backdrop-filter:blur(8px);z-index:3}h1{font:700 22px 'Space Grotesk',sans-serif;margin:0}.links{display:flex;gap:8px}.btn{color:var(--text);text-decoration:none;border:1px solid var(--line2);padding:7px 10px;border-radius:6px;font-size:10px}.wrap{max-width:1280px;margin:auto;padding:24px 28px 70px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{border:1px solid var(--line);border-radius:7px;padding:11px}.metric span{display:block;color:var(--muted);font-size:9px;margin-bottom:6px}.metric strong{font-size:14px}.small{font-size:9px;color:var(--muted);line-height:1.6}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:10px}.table th,.table td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{color:var(--muted);font-weight:500}.ok{color:var(--up)}.bad{color:var(--bad)}.warn{color:var(--warn)}.row-bad{background:rgba(255,123,132,.035)}.row-ok{background:rgba(114,214,165,.02)}.title{font:700 13px 'Space Grotesk',sans-serif;margin-bottom:10px}.back{color:var(--muted);font-size:10px;text-decoration:none}@media(max-width:800px){header{padding:18px 16px}.wrap{padding:18px 14px 60px}.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><h1><span style="display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:999px;background:#202733;border:1px solid #3a4658;font-size:10px;margin-right:6px">⑥</span>데이터 검증</h1><div class="links"><a class="btn" href="index.html">← 관심종목</a></div></header><main class="wrap"><a class="back" href="index.html">← 관심종목으로 돌아가기</a><div id="app" style="margin-top:14px">불러오는 중…</div></main><script>
const app=document.getElementById('app');function n(v){return v==null||!Number.isFinite(Number(v))?'-':Number(v).toLocaleString('ko-KR')}function status(ok){return ok?'<span class="ok">🟢 정상</span>':'<span class="bad">🔴 실패</span>'}
async function load(){const [vr,sr]=await Promise.all([fetch('data/validation.json?ts='+Date.now()),fetch('data/stocks.json?ts='+Date.now())]);const v=vr.ok?await vr.json():null;const st=sr.ok?await sr.json():{stocks:[]};if(!v){app.innerHTML='<div class="card"><b class="bad">validation.json이 없습니다.</b><div class="small">GitHub Actions가 새 버전의 scraper.py를 실행한 뒤 생성됩니다.</div></div>';return}const c=v.coverage||{}, total=v.universe||st.stocks.length;const rows=(v.stocks||[]);const sd=v.shortSellingBatch||{};app.innerHTML=`<div class="card"><div class="title">전체 수집 상태</div><div class="grid"><div class="metric"><span>종목</span><strong>${total}개</strong></div><div class="metric"><span>수급</span><strong class="${c.flow===total?'ok':'bad'}">${c.flow||0}/${total}</strong></div><div class="metric"><span>재무</span><strong class="${c.financial===total?'ok':'bad'}">${c.financial||0}/${total}</strong></div><div class="metric"><span>공매도</span><strong class="${c.short===total?'ok':'bad'}">${c.short||0}/${total}</strong></div></div><p class="small" style="margin-top:10px">업데이트: ${v.updatedAt||'-'} · 점수 사용 가능 종목: ${v.scoreReady||0}/${total}</p>${sd.status==='blocked'?'<div class="small warn" style="margin-top:8px">⚠️ 공매도: '+(sd.message||'KRX 로그인 인증정보가 필요합니다.')+'</div>':''}</div><div class="card"><div class="title">35개 종목 개별 검증</div><div class="table-wrap"><table class="table"><thead><tr><th>종목</th><th>수급</th><th>외국인</th><th>기관</th><th>재무</th><th>ROE</th><th>부채비율</th><th>공매도</th><th>공매도 기준일</th><th>판정</th></tr></thead><tbody>${rows.map(x=>{const f=x.flow?.ok,fin=x.financial?.ok,sh=x.short?.ok,ready=f&&fin&&sh;return `<tr class="${ready?'row-ok':'row-bad'}"><td><b>${x.name}</b><br><span class="small">${x.code}</span></td><td>${status(f)}</td><td>${n(st.stocks.find(s=>s.code===x.code)?.foreignNet)}<br><span class="small">${x.flow?.date||'-'}</span></td><td>${n(st.stocks.find(s=>s.code===x.code)?.instNet)}</td><td>${status(fin)}<br><span class="small">${x.financial?.period||'-'}${x.financial?.method?' · '+x.financial.method:''}</span></td><td>${x.roe==null?'-':Number(x.roe).toFixed(2)+'%'}</td><td>${x.debtRatio==null?'-':Number(x.debtRatio).toFixed(2)+'%'}</td><td>${status(sh)}<br>${x.shortSellingRatio==null?'-':Number(x.shortSellingRatio).toFixed(2)+'%'}</td><td>${x.short?.date||'-'}</td><td>${ready?'<span class="ok">🟢 검증완료</span>':'<span class="bad">🔴 검증필요</span>'}</td></tr>`}).join('')}</tbody></table></div></div><div class="card"><div class="title">검증 정책</div><div class="small">${v.policy||''}<br>• 수급: 외국인 또는 기관 값이 실제로 존재해야 정상<br>• 재무: ROE와 부채비율이 모두 확보되어야 정상<br>• 공매도: 잔고비중과 기준일이 모두 있어야 정상<br>• 기존 버전 데이터는 재무·공매도에 재사용하지 않음<br>• 공매도는 KRX T+2 공표 지연을 고려해 기준일을 함께 표시</div></div>`}
load().catch(e=>{console.error(e);app.innerHTML='<div class="card"><span class="bad">검증 데이터를 불러오지 못했습니다.</span></div>'});
</script></body></html>
