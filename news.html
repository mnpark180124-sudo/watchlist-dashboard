<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>뉴스·공시 모니터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0e11;
    --panel: #12161c;
    --panel-hover: #171c24;
    --line: #1f2530;
    --line-strong: #2a3140;
    --text: #e8eaed;
    --muted: #6b7684;
    --up: #f04452;
    --down: #3182f6;
    --flat: #6b7684;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 26px 32px 18px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: rgba(11,14,17,0.92);
    backdrop-filter: blur(8px);
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 22px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  #meta {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 14px;
    align-items: center;
  }
  #meta a, #meta button {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--muted);
    font-family: inherit;
    font-size: 11px;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    text-decoration: none;
  }
  #meta a:hover, #meta button:hover { background: var(--panel-hover); border-color: var(--line-strong); }

  main {
    max-width: 1360px;
    margin: 0 auto;
    padding: 20px 32px 80px;
  }

  #geo-banner {
    display: none;
    font-size: 12px;
    font-weight: 500;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 20px;
  }
  #geo-banner.down { display: block; background: rgba(240,68,82,0.1); border: 1px solid rgba(240,68,82,0.3); color: var(--up); }
  #geo-banner.up { display: block; background: rgba(49,130,246,0.1); border: 1px solid rgba(49,130,246,0.3); color: var(--down); }

  #summary-strip {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 24px;
  }
  .summary-pill {
    flex: 0 0 auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }
  .summary-pill b { color: var(--text); }

  #sectors {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 20px;
  }

  .sector-card {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    overflow: hidden;
  }
  .sector-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }
  .sector-name {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.02em;
  }
  .sector-count { font-size: 11px; color: var(--muted); }

  .news-item {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
  }
  .news-item:last-child { border-bottom: none; }
  .news-item.quiet { opacity: 0.4; }
  .news-item-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .news-name {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12.5px;
    font-weight: 500;
  }
  .news-badge {
    display: inline-block;
    font-size: 9.5px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
  }
  .news-badge.up { background: rgba(240,68,82,0.15); color: var(--up); }
  .news-badge.down { background: rgba(49,130,246,0.15); color: var(--down); }
  .news-badge.neutral { background: rgba(107,118,132,0.18); color: var(--muted); }
  .news-meta { font-size: 10px; color: var(--muted); margin-bottom: 5px; }
  .news-summary { font-size: 11.5px; line-height: 1.55; }
  .news-item.quiet .news-summary { color: var(--muted); }
  .impact-bar {
    margin-top: 8px;
    height: 3px;
    border-radius: 2px;
    background: var(--line);
    overflow: hidden;
  }
  .impact-bar-fill { height: 100%; background: currentColor; }

  #empty {
    color: var(--muted);
    font-size: 13px;
    padding: 60px 8px;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1>뉴스·공시 모니터</h1>
  <div id="meta">
    <span id="updated">불러오는 중…</span>
    <a href="index.html">← 관심종목</a>
    <a href="backtest.html">백테스트 기록</a>
  </div>
</header>

<main>
  <div id="geo-banner"></div>
  <div id="summary-strip"></div>
  <div id="sectors"></div>
  <div id="empty" style="display:none">아직 데이터가 없어요.</div>
</main>

<script>
  function dirOf(direction) {
    return direction === 'down' ? 'down' : direction === 'up' ? 'up' : 'neutral';
  }

  async function load() {
    try {
      const [stocksRes, newsRes, geoRes] = await Promise.all([
        fetch('data/stocks.json?ts=' + Date.now()),
        fetch('data/news.json?ts=' + Date.now()),
        fetch('data/geopolitical.json?ts=' + Date.now()).catch(() => null),
      ]);
      if (!stocksRes.ok || !newsRes.ok) throw new Error('no data yet');
      const stocks = await stocksRes.json();
      const news = await newsRes.json();
      const geo = (geoRes && geoRes.ok) ? await geoRes.json() : null;

      renderGeo(geo);
      renderUpdated(stocks, geo);
      render(stocks, news);
    } catch (e) {
      document.getElementById('empty').style.display = 'block';
      document.getElementById('updated').textContent = '데이터 없음';
    }
  }

  function renderGeo(geo) {
    const el = document.getElementById('geo-banner');
    if (geo && geo.hasRisk) {
      const dir = geo.direction === 'down' ? 'down' : 'up';
      el.className = dir;
      el.textContent = `⚠️ 미국-이란 지정학적 리스크 감지 (${dir === 'down' ? '악재' : '호재'}) — ${geo.summary}`;
    } else {
      el.className = '';
      el.style.display = 'none';
    }
  }

  function renderUpdated(stocks, geo) {
    const el = document.getElementById('updated');
    const ts = geo && geo.updatedAt ? geo.updatedAt : (stocks && stocks.updatedAt);
    el.textContent = ts ? '업데이트: ' + new Date(ts).toLocaleString('ko-KR', { hour12: false }) : '';
  }

  function render(stocksData, news) {
    // 종목명 -> 섹터 매핑은 stocks.json 재사용 (별도 파일 필요 없음)
    const bySector = {};
    for (const s of stocksData.stocks) {
      const sector = s.sector || '기타';
      (bySector[sector] ||= []).push(s.name);
    }

    const strip = document.getElementById('summary-strip');
    strip.innerHTML = '';

    const sectorNames = Object.keys(bySector).sort((a, b) => {
      const countA = bySector[a].filter(name => news[name] && news[name].hasImportantNews).length;
      const countB = bySector[b].filter(name => news[name] && news[name].hasImportantNews).length;
      return countB - countA;
    });

    sectorNames.forEach(sector => {
      const withNews = bySector[sector].filter(name => news[name] && news[name].hasImportantNews).length;
      if (withNews === 0) return;
      const pill = document.createElement('div');
      pill.className = 'summary-pill';
      pill.innerHTML = `${sector} <b>${withNews}건</b>`;
      strip.appendChild(pill);
    });
    if (!strip.children.length) {
      strip.innerHTML = `<div class="summary-pill">오늘 특이 뉴스·공시 없음</div>`;
    }

    const container = document.getElementById('sectors');
    container.innerHTML = sectorNames.map(sector => {
      const names = [...bySector[sector]].sort((a, b) => {
        const nA = news[a], nB = news[b];
        const impA = nA && nA.hasImportantNews ? (nA.impactPct || 0) : -1;
        const impB = nB && nB.hasImportantNews ? (nB.impactPct || 0) : -1;
        return impB - impA;
      });
      const withNews = names.filter(name => news[name] && news[name].hasImportantNews).length;

      const items = names.map(name => {
        const n = news[name];
        const has = n && n.hasImportantNews;
        const dir = has ? dirOf(n.direction) : 'neutral';
        const sourceTag = n && n.source === '공시' ? '📄 공시' : '📰 뉴스';
        const dateTag = n && n.date ? ` · ${n.date}` : '';

        return `
          <div class="news-item${has ? '' : ' quiet'}">
            <div class="news-item-top">
              <span class="news-name">${name}</span>
              <span class="news-badge ${dir}">${has ? sourceTag : '특이사항 없음'}</span>
            </div>
            ${has ? `<div class="news-meta">${dateTag.replace(' · ', '')}</div>` : ''}
            <div class="news-summary">${has ? n.summary : '최근 3일 내 확인된 주요 뉴스·공시가 없습니다.'}</div>
            ${has ? `<div class="impact-bar" style="color:var(--${dir === 'down' ? 'down' : dir === 'up' ? 'up' : 'flat'})"><div class="impact-bar-fill" style="width:${Math.min(100, n.impactPct || 0)}%"></div></div>` : ''}
          </div>`;
      }).join('');

      return `
        <div class="sector-card">
          <div class="sector-head">
            <span class="sector-name">${sector}</span>
            <span class="sector-count">${withNews}/${names.length}개 종목 이슈</span>
          </div>
          ${items}
        </div>`;
    }).join('');
  }

  load();
</script>

</body>
</html>
