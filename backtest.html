<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>평가점수 백테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0e11; --panel: #12161c; --panel-hover: #171c24;
    --line: #1f2530; --line-strong: #2a3140; --text: #e8eaed; --muted: #6b7684;
    --up: #f04452; --down: #3182f6; --flat: #6b7684;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'JetBrains Mono', monospace; -webkit-font-smoothing:antialiased; }
  header { padding:26px 32px 18px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:10px; }
  h1 { font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:22px; margin:0; }
  a.back { color:var(--muted); font-size:12px; text-decoration:none; border:1px solid var(--line); padding:6px 12px; border-radius:6px; }
  a.back:hover { background:var(--panel-hover); }
  main { max-width:1000px; margin:0 auto; padding:28px 32px 80px; }

  #progress { font-size:13px; color:var(--muted); margin-bottom:8px; }
  #progress-bar { height:8px; background:var(--panel); border-radius:4px; overflow:hidden; margin-bottom:28px; }
  #progress-fill { height:100%; background:linear-gradient(90deg, var(--down), var(--up)); }

  .groups { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:16px; margin-bottom:32px; }
  .group-card { border:1px solid var(--line); border-radius:10px; background:var(--panel); padding:18px; }
  .group-title { font-family:'Space Grotesk', sans-serif; font-size:13px; font-weight:700; margin-bottom:10px; }
  .group-stat { font-size:26px; font-weight:700; font-family:'Space Grotesk', sans-serif; }
  .group-sub { font-size:11px; color:var(--muted); margin-top:6px; }

  table { width:100%; border-collapse:collapse; font-size:12px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; }
  .up { color:var(--up); } .down { color:var(--down); } .flat { color:var(--flat); }

  .week-tab {
    background:var(--panel); border:1px solid var(--line); color:var(--muted);
    font-family:'JetBrains Mono', monospace; font-size:11.5px; padding:7px 12px;
    border-radius:6px; cursor:pointer;
  }
  .week-tab:hover { background:var(--panel-hover); }
  .week-tab.active { background:var(--text); color:var(--bg); border-color:var(--text); font-weight:700; }

  .day-section { border:1px solid var(--line); border-radius:10px; background:var(--panel); margin-bottom:16px; overflow:hidden; }
  .day-head { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:8px; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--panel-hover); }
  .day-date { font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:14px; }
  .day-summary { font-size:11px; color:var(--muted); font-weight:700; }
  .day-section table { font-size:12px; }
  .day-section th, .day-section td { padding:7px 16px; }
  .sub-label { font-size:10.5px; font-weight:700; padding:8px 16px 4px; }

  #disclaimer { font-size:11px; color:var(--muted); margin-bottom:24px; line-height:1.6; }
  #empty { color:var(--muted); font-size:13px; padding:40px 0; text-align:center; }
</style>
</head>
<body>

<header>
  <h1>평가점수 백테스트 기록</h1>
  <div style="display:flex; gap:8px;">
    <a class="back" href="score-history.html">일별 점수 기록</a>
    <a class="back" href="index.html">← 대시보드로</a>
  </div>
</header>

<main>
  <p id="disclaimer">전날 평가점수와 다음날 실제 등락률을 계속 짝지어 쌓은 기록입니다. 표본이 적으면
  (특히 100일 미만) 우연에 의한 결과일 수 있으니 참고용으로만 봐주세요. "시장 대비 초과수익률"은
  같은 기간 코스피 등락률을 뺀 값으로, 종목이 시장 전체보다 더/덜 갔는지를 보여줍니다(이 기능을
  추가한 날짜 이후 기록부터만 표시돼요). 이 페이지는 투자 조언이 아닙니다.</p>

  <div id="progress"></div>
  <div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>

  <div class="groups" id="groups"></div>

  <div id="mdd-section" style="margin-bottom:28px;"></div>

  <div id="bt-week-tabs" style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px;"></div>
  <div id="table-wrap"></div>
  <div id="empty" style="display:none">아직 쌓인 기록이 없어요. snapshot.py가 매일 장 마감 후 자동으로 기록을 쌓습니다.</div>
</main>

<script>
  const GOAL_DAYS = 100;

  async function load() {
    try {
      const [btRes, histRes] = await Promise.all([
        fetch('data/backtest.json?ts=' + Date.now()),
        fetch('data/score_history.json?ts=' + Date.now()),
      ]);
      const backtest = btRes.ok ? await btRes.json() : { entries: [] };
      const history = histRes.ok ? await histRes.json() : { days: [] };
      render(backtest.entries, history.days.length);
    } catch (e) {
      document.getElementById('empty').style.display = 'block';
    }
  }

  function render(entries, dayCount) {
    const pct = Math.min(100, (dayCount / GOAL_DAYS) * 100);
    document.getElementById('progress').textContent =
      `누적 기록: ${dayCount}일 / 목표 ${GOAL_DAYS}일 (${pct.toFixed(0)}%) · 수익률 표본 ${entries.length}건`;
    document.getElementById('progress-fill').style.width = pct + '%';

    if (!entries.length) {
      document.getElementById('empty').style.display = 'block';
      return;
    }

    const high = entries.filter(e => e.prevScore >= 70);
    const low = entries.filter(e => e.prevScore <= 30);
    const mid = entries.filter(e => e.prevScore > 30 && e.prevScore < 70);

    const avg = arr => arr.length ? arr.reduce((s, e) => s + e.nextDayReturn, 0) / arr.length : null;
    const winRate = arr => arr.length ? (arr.filter(e => e.nextDayReturn > 0).length / arr.length * 100) : null;
    const avgExcess = arr => {
      const withExcess = arr.filter(e => e.excessReturn != null);
      return withExcess.length ? withExcess.reduce((s, e) => s + e.excessReturn, 0) / withExcess.length : null;
    };

    const groups = [
      { label: '고점수군 (70점 이상)', data: high },
      { label: '중간 (30~70점)', data: mid },
      { label: '저점수군 (30점 이하)', data: low },
    ];

    document.getElementById('groups').innerHTML = groups.map(g => {
      const a = avg(g.data);
      const w = winRate(g.data);
      const ex = avgExcess(g.data);
      const exCount = g.data.filter(e => e.excessReturn != null).length;
      const dir = a == null ? 'flat' : a > 0 ? 'up' : a < 0 ? 'down' : 'flat';
      const exDir = ex == null ? 'flat' : ex > 0 ? 'up' : ex < 0 ? 'down' : 'flat';
      return `
        <div class="group-card">
          <div class="group-title">${g.label}</div>
          <div class="group-stat ${dir}">${a == null ? '-' : (a > 0 ? '+' : '') + a.toFixed(2) + '%'}</div>
          <div class="group-sub">평균 다음날 수익률 · 표본 ${g.data.length}건${w == null ? '' : ` · 상승 비율 ${w.toFixed(0)}%`}</div>
          ${ex != null ? `<div class="group-stat ${exDir}" style="font-size:16px; margin-top:8px;">${ex > 0 ? '+' : ''}${ex.toFixed(2)}%</div>
          <div class="group-sub">시장(코스피) 대비 초과수익률 · 표본 ${exCount}건</div>` : ''}
        </div>`;
    }).join('');

    renderMDD(entries);
    renderByDate(entries);
  }

  function computeGroupCurve(entries, filterFn) {
    // 날짜별로 그룹에 속한 종목들의 그날 평균 수익률을 구하고, 100에서 시작하는 누적 곡선을 만든다
    const byDate = {};
    for (const e of entries) {
      if (!filterFn(e.prevScore)) continue;
      (byDate[e.date] ||= []).push(e.nextDayReturn);
    }
    const dates = Object.keys(byDate).sort();
    let equity = 100, peak = 100, mdd = 0, mddDate = null;
    const curve = [];
    for (const d of dates) {
      const vals = byDate[d];
      const avgRet = vals.reduce((a, b) => a + b, 0) / vals.length;
      equity *= (1 + avgRet / 100);
      if (equity > peak) peak = equity;
      const dd = (peak - equity) / peak * 100;
      if (dd > mdd) { mdd = dd; mddDate = d; }
      curve.push(equity);
    }
    return { curve, mdd, mddDate, dayCount: dates.length, finalEquity: equity };
  }

  function sparklineSVG(curve, color) {
    if (curve.length < 2) return '<div style="font-size:11px; color:var(--muted);">표본 부족</div>';
    const w = 260, h = 60, pad = 4;
    const min = Math.min(...curve), max = Math.max(...curve);
    const range = (max - min) || 1;
    const pts = curve.map((v, i) => {
      const x = pad + (i / (curve.length - 1)) * (w - pad * 2);
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:60px;">
      <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>`;
  }

  function renderMDD(entries) {
    const groups = [
      { label: '고점수군 (70점 이상)', filter: s => s >= 70, color: 'var(--up)' },
      { label: '중간 (30~70점)', filter: s => s > 30 && s < 70, color: 'var(--text)' },
      { label: '저점수군 (30점 이하)', filter: s => s <= 30, color: 'var(--down)' },
    ];

    document.getElementById('mdd-section').innerHTML = `
      <h2 style="font-family:'Space Grotesk',sans-serif; font-size:15px; margin:0 0 4px;">최대낙폭 비교 (그룹별 매일 갈아타기 시뮬레이션)</h2>
      <p style="font-size:11px; color:var(--muted); margin:0 0 14px; line-height:1.5;">
        그 점수대 종목들을 매일 동일 비중으로 갈아탔다고 가정하고 100에서 시작해 누적했을 때,
        고점 대비 가장 많이 빠졌던 순간의 하락폭이에요. 표본이 적은 구간은 신뢰도가 낮아요.
      </p>
      <div class="groups">
        ${groups.map(g => {
          const { curve, mdd, mddDate, dayCount, finalEquity } = computeGroupCurve(entries, g.filter);
          return `
            <div class="group-card">
              <div class="group-title">${g.label}</div>
              ${sparklineSVG(curve, g.color)}
              <div class="group-stat down" style="margin-top:8px;">-${mdd.toFixed(2)}%</div>
              <div class="group-sub">최대낙폭(MDD)${mddDate ? ` · ${mddDate}` : ''} · 거래일 ${dayCount}일</div>
              <div class="group-sub">누적 자산: 100 → ${finalEquity.toFixed(1)}</div>
            </div>`;
        }).join('')}
      </div>`;
  }

  function mondayOf(dateStr) {
    // 시간대 영향 없는 순수 UTC 날짜 계산 (score-history.html과 동일한 방식)
    const [y, m, d] = dateStr.split('-').map(Number);
    const utcDate = new Date(Date.UTC(y, m - 1, d));
    const day = utcDate.getUTCDay();
    const diff = (day === 0 ? -6 : 1 - day);
    utcDate.setUTCDate(utcDate.getUTCDate() + diff);
    return utcDate.toISOString().slice(0, 10);
  }

  let btWeeks = [];
  let btCurrentWeekIdx = 0;

  function renderByDate(entries) {
    if (!entries.length) return;

    const byDate = {};
    for (const e of entries) {
      (byDate[e.date] ||= []).push(e);
    }
    const byWeek = {};
    for (const date of Object.keys(byDate)) {
      const wk = mondayOf(date);
      (byWeek[wk] ||= []).push(date);
    }
    btWeeks = Object.keys(byWeek).sort((a, b) => b.localeCompare(a)) // 최신 주 먼저
      .map(wk => ({ weekStart: wk, dates: byWeek[wk].sort((a, b) => b.localeCompare(a)), byDate }));

    btCurrentWeekIdx = 0;
    renderBtWeekTabs();
    renderBtWeek();
  }

  function renderBtWeekTabs() {
    document.getElementById('bt-week-tabs').innerHTML = btWeeks.map((w, i) => {
      const sorted = [...w.dates].sort();
      const start = sorted[0].slice(5).replace('-', '/');
      const end = sorted[sorted.length - 1].slice(5).replace('-', '/');
      return `<button class="week-tab ${i === btCurrentWeekIdx ? 'active' : ''}" onclick="selectBtWeek(${i})">${start}~${end}</button>`;
    }).join('');
  }

  function selectBtWeek(i) {
    btCurrentWeekIdx = i;
    renderBtWeekTabs();
    renderBtWeek();
  }
  window.selectBtWeek = selectBtWeek;

  function renderBtWeek() {
    const week = btWeeks[btCurrentWeekIdx];
    if (!week) return;

    const avg = arr => arr.length ? arr.reduce((s, e) => s + e.nextDayReturn, 0) / arr.length : null;
    const dates = [...week.dates].sort((a, b) => b.localeCompare(a)); // 주 안에서는 최신 날짜 먼저

    document.getElementById('table-wrap').innerHTML = dates.map(date => {
      const dayEntries = [...week.byDate[date]].sort((a, b) => b.nextDayReturn - a.nextDayReturn);
      const gainers = dayEntries.filter(e => e.nextDayReturn > 0);
      const losers = dayEntries.filter(e => e.nextDayReturn < 0);
      const flats = dayEntries.filter(e => e.nextDayReturn === 0);
      const gainAvg = avg(gainers);
      const lossAvg = avg(losers);

      const rowsHtml = list => list.map(e => {
        const dir = e.nextDayReturn > 0 ? 'up' : e.nextDayReturn < 0 ? 'down' : 'flat';
        return `<tr>
          <td>${e.name}</td>
          <td>${e.prevScore.toFixed(1)}</td>
          <td class="${dir}">${e.nextDayReturn > 0 ? '+' : ''}${e.nextDayReturn.toFixed(2)}%</td>
        </tr>`;
      }).join('');

      return `
        <div class="day-section">
          <div class="day-head">
            <span class="day-date">${date}</span>
            <span class="day-summary">
              <span class="up">상승 ${gainers.length}건 평균 ${gainAvg == null ? '-' : '+' + gainAvg.toFixed(2) + '%'}</span>
              &nbsp;·&nbsp;
              <span class="down">하락 ${losers.length}건 평균 ${lossAvg == null ? '-' : lossAvg.toFixed(2) + '%'}</span>
            </span>
          </div>
          ${gainers.length ? `
          <div class="sub-label up">▲ 상승 (${gainers.length}건)</div>
          <table><thead><tr><th>종목</th><th>전날 점수</th><th>다음날 수익률</th></tr></thead>
          <tbody>${rowsHtml(gainers)}</tbody></table>` : ''}
          ${losers.length ? `
          <div class="sub-label down">▼ 하락 (${losers.length}건)</div>
          <table><thead><tr><th>종목</th><th>전날 점수</th><th>다음날 수익률</th></tr></thead>
          <tbody>${rowsHtml(losers)}</tbody></table>` : ''}
          ${flats.length ? `
          <div class="sub-label flat">- 보합 (${flats.length}건)</div>
          <table><thead><tr><th>종목</th><th>전날 점수</th><th>다음날 수익률</th></tr></thead>
          <tbody>${rowsHtml(flats)}</tbody></table>` : ''}
        </div>`;
    }).join('');
  }

  load();
</script>

</body>
</html>
