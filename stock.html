<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>종목 상세 분석</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0e11;--panel:#12161c;--line:#1f2530;--line2:#2a3140;--text:#e8eaed;--muted:#6b7684;--up:#f04452;--down:#3182f6;--flat:#6b7684}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace}header{padding:24px 32px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;align-items:center;position:sticky;top:0;background:rgba(11,14,17,.94);backdrop-filter:blur(8px);z-index:3}h1{font:700 22px 'Space Grotesk',sans-serif;margin:0}.links{display:flex;gap:8px}.btn{color:var(--text);text-decoration:none;border:1px solid var(--line2);padding:7px 10px;border-radius:6px;font-size:10px}.wrap{max-width:1100px;margin:auto;padding:24px 28px 70px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.name{font:700 25px 'Space Grotesk',sans-serif}.code{color:var(--muted);font-size:11px;margin-top:4px}.price{font-size:25px;font-weight:700;text-align:right}.change{text-align:right;margin-top:4px}.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--flat)}.badge{display:inline-flex;padding:5px 9px;border:1px solid var(--line2);border-radius:999px;font-size:11px;margin-top:10px}.good{color:#72d6a5;border-color:#245b44}.warn{color:#e6c36a;border-color:#67552a}.bad{color:#ff7b84;border-color:#6d3037}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{border:1px solid var(--line);border-radius:7px;padding:10px}.metric span{display:block;color:var(--muted);font-size:9px;margin-bottom:5px}.metric strong{font-size:13px}.section-title{font:700 13px 'Space Grotesk',sans-serif;margin-bottom:10px}.checks{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.check{border:1px solid var(--line);border-radius:7px;padding:9px;font-size:9px}.check .q{color:var(--muted);margin-bottom:6px}.yes{color:#72d6a5}.no{color:#ff7b84}.na{color:#e6c36a}.reasons{line-height:1.8;color:#b7bec8;font-size:10px}.chart{width:100%;height:250px;border:1px solid var(--line);border-radius:7px;background:#0d1116}.legend{color:var(--muted);font-size:9px;margin-top:6px}.table-wrap{overflow:auto}.history{width:100%;border-collapse:collapse;font-size:9px}.history th,.history td{padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.history th{color:var(--muted);font-weight:500}.small{font-size:9px;color:var(--muted);line-height:1.6}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.back{margin-bottom:12px;display:inline-block;color:var(--muted);font-size:10px;text-decoration:none}@media(max-width:700px){header{padding:18px 16px}.wrap{padding:18px 14px 60px}.grid,.checks,.stats{grid-template-columns:repeat(2,1fr)}.hero{flex-direction:column}.price{text-align:left}.change{text-align:left}.chart{height:210px}}

.guide{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 14px;margin-bottom:16px;}
.guide-title{font:700 12px 'Space Grotesk',sans-serif;margin-bottom:7px;}
.guide-list{display:flex;flex-wrap:wrap;gap:6px;}
.guide-item{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:6px 8px;line-height:1.35;}
.guide-item b{color:var(--text);margin-right:4px;}
.num{display:inline-flex;align-items:center;justify-content:center;min-width:21px;height:21px;padding:0 6px;border-radius:999px;background:#202733;border:1px solid #3a4658;color:var(--text);font:700 10px 'JetBrains Mono',monospace;margin-right:6px;vertical-align:middle;}
.section-help{color:var(--muted);font-size:10px;line-height:1.5;margin:-4px 0 10px;}
@media(max-width:700px){.guide-list{display:grid;grid-template-columns:1fr 1fr}.guide-item{font-size:9px}}
</style></head><body>
<header><h1><span class="num">②</span>종목 상세 분석</h1><div class="links"><a class="btn" href="index.html">← 관심종목</a><a id="naver" class="btn" target="_blank" rel="noopener">네이버 금융 ↗</a></div></header>
<div class="wrap" id="app">
<div class="guide"><div class="guide-title">② 이 화면에서 확인할 것</div><div class="guide-list">
<div class="guide-item"><b>②-1 현재 분석</b>기존 평가점수와 가격 위치</div>
<div class="guide-item"><b>②-2 V4-2</b>5가지 질문으로 현재 흐름 판단</div>
<div class="guide-item"><b>②-3 가격 흐름</b>최근 가격 움직임 확인</div>
<div class="guide-item"><b>②-4 자동 기록</b>당시 판정 후 실제 결과 확인</div>
<div class="guide-item"><b>②-5 패턴 성과</b>같은 패턴의 과거 성과 확인</div>
</div></div>
<div>불러오는 중…</div></div>
<script>
const SIDE5=2, SIDE20=5;
function fmt(n){return n==null||!Number.isFinite(Number(n))?'-':Number(n).toLocaleString('ko-KR')}
function pct(n){return n==null||!Number.isFinite(Number(n))?'-':`${n>0?'+':''}${Number(n).toFixed(1)}%`}
function getMap(h){const m={};for(const d of (h?.days||[]))for(const s of (d.stocks||[])){if(Number.isFinite(Number(s.price)))(m[s.code]??=[]).push({date:d.date,price:Number(s.price)})}for(const k in m)m[k].sort((a,b)=>a.date.localeCompare(b.date));return m}
function v41(s,m){const a=m[s.code]||[], price=Number(s.price), hi=Number(s.week52High),lo=Number(s.week52Low);const highDrop=hi>0?(price/hi-1)*100:null,pos=hi>lo?(price-lo)/(hi-lo)*100:null,r5=a.length>=6?(a.at(-1).price/a.at(-6).price-1)*100:null,r20=a.length>=21?(a.at(-1).price/a.at(-21).price-1)*100:null;let pattern='관찰',cls='warn';if(highDrop>-10&&r5>3){pattern='고점 추격 주의';cls='bad'}else if(highDrop<=-15&&r20<0&&Math.abs(r5)<=SIDE5){pattern='조정 후 횡보';cls='good'}else if(r5>0&&r20>0){pattern='상승 추세';cls='good'}else if(r5<-3&&r20<-5){pattern='하락 추세';cls='bad'}else if(Math.abs(r5)<=SIDE5){pattern='단기 횡보'}return{highDrop,pos,r5,r20,pattern,cls}}
const SW={target:.30,opinion:.20,week52:.15,news:.15,financial:.10,shortSelling:.10}, OS={'강력매수':100,'매수':80,'중립':50,'매도':20,'강력매도':0}, MW={usdkrw:5,nasdaq:5,geo:4,vix:3,us10y:2};
function score(s,n,macro,geo){let p=[];if(s.targetPrice&&s.price){let u=(s.targetPrice/s.price-1)*100;p.push([Math.max(0,Math.min(100,u/50*100)),SW.target])}if(OS[s.opinion]!=null)p.push([OS[s.opinion],SW.opinion]);if(s.week52High&&s.week52Low&&s.week52High>s.week52Low){let pos=(s.price-s.week52Low)/(s.week52High-s.week52Low)*100;p.push([Math.max(0,Math.min(100,100-pos)),SW.week52])}let ns=50;if(n?.hasImportantNews&&n?.materialImpact){let imp=Math.max(0,Math.min(30,Number(n.impactPct)||0));ns=n.direction==='down'?50-imp/2:n.direction==='up'?50+imp/2:50}p.push([ns,SW.news]);let fp=[];if(s.debtRatio!=null)fp.push(Math.max(0,Math.min(100,100-s.debtRatio/2)));if(s.roe!=null)fp.push(Math.max(0,Math.min(100,s.roe*5)));if(fp.length)p.push([fp.reduce((a,b)=>a+b,0)/fp.length,SW.financial]);if(s.shortSellingRatio!=null)p.push([Math.max(0,Math.min(100,100-s.shortSellingRatio*10)),SW.shortSelling]);let tw=p.reduce((a,x)=>a+x[1],0);if(!tw)return null;let base=p.reduce((a,x)=>a+x[0]*x[1],0)/tw,adj=0;const m=macro||{};if(m.usdkrw?.changeRate!=null)adj+=m.usdkrw.changeRate<0?5:m.usdkrw.changeRate>0?-5:0;if(m.nasdaq?.changeRate!=null)adj+=m.nasdaq.changeRate>0?5:m.nasdaq.changeRate<0?-5:0;if(geo?.hasRisk)adj+=geo.direction==='down'?-4:geo.direction==='up'?4:0;if(m.vix?.changeRate!=null)adj+=m.vix.changeRate>0?-3:m.vix.changeRate<0?3:0;if(m.us10y?.changeRate!=null)adj+=m.us10y.changeRate>0?-2:m.us10y.changeRate<0?2:0;return Math.max(0,Math.min(100,base+adj))}
function fin(s){const d=Number(s.debtRatio),r=Number(s.roe);if(!Number.isFinite(d)&&!Number.isFinite(r))return null;let p=[];if(Number.isFinite(d))p.push(Math.max(0,Math.min(100,100-d/2)));if(Number.isFinite(r))p.push(Math.max(0,Math.min(100,r*5)));return p.reduce((a,b)=>a+b,0)/p.length>=60}
function calcVol(arr,n=5){if(!arr||arr.length<n+1)return null;const rs=[];for(let i=arr.length-n+1;i<arr.length;i++)if(arr[i-1]?.price)rs.push((arr[i].price/arr[i-1].price-1)*100);if(rs.length<n)return null;const m=rs.reduce((a,b)=>a+b,0)/rs.length;return Math.sqrt(rs.reduce((a,b)=>a+(b-m)**2,0)/rs.length)}
function v42(s,m,marketPrices){const v=v41(s,m),arr=m[s.code]||[],r5=v.r5,r20=v.r20,prev5=arr.length>=11?(arr.at(-6).price/arr.at(-11).price-1)*100:null,prev20=arr.length>=41?(arr.at(-21).price/arr.at(-41).price-1)*100:null,vol5=calcVol(arr,5),prevVol5=calcVol(arr.length>=11?arr.slice(0,-5):[],5),marketR5=marketPrices?.length>=6?(marketPrices.at(-1)/marketPrices.at(-6)-1)*100:null,q1=r5==null?null:r5>0,q2=(r20==null||prev20==null)?null:r20>prev20,q3=(r5==null||prev5==null)?null:(r5>prev5&&r5>=-2),q4=(vol5==null||prevVol5==null)?null:vol5<prevVol5,q5=(r5==null||marketR5==null)?null:r5>marketR5,checks=[q1,q2,q3,q4,q5],trueCount=checks.filter(x=>x===true).length,knownCount=checks.filter(x=>x!==null).length;let status='관찰',cls='warn';if(['고점 추격 주의','하락 추세'].includes(v.pattern)){status='주의';cls='bad'}else if(knownCount>=3&&trueCount/knownCount>=.8){status='관심';cls='good'}else if(knownCount>=3&&trueCount/knownCount<=.4){status='주의';cls='bad'}return{...v,q1,q2,q3,q4,q5,trueCount,knownCount,prev5,prev20,vol5,prevVol5,marketR5,status,cls}}
function qmark(v){return v===true?'<b class="yes">✓ 충족</b>':v===false?'<b class="no">✕ 미충족</b>':'<b class="na">— 데이터 부족</b>'}
function svgChart(arr){if(!arr.length)return'<div class="small">가격 기록이 아직 없습니다.</div>';const w=1000,h=250,p=24,vals=arr.map(x=>x.price),mn=Math.min(...vals),mx=Math.max(...vals),span=mx-mn||1;const pts=arr.map((x,i)=>`${p+i*(w-p*2)/Math.max(1,arr.length-1)},${h-p-(x.price-mn)/span*(h-p*2)}`).join(' ');const first=arr[0].date,last=arr.at(-1).date;return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill="none" stroke="currentColor" stroke-width="3" points="${pts}"/><text x="${p}" y="${h-7}" fill="#6b7684" font-size="11">${first}</text><text x="${w-p-70}" y="${h-7}" fill="#6b7684" font-size="11">${last}</text><text x="${p}" y="18" fill="#6b7684" font-size="11">${fmt(mx)}</text><text x="${p}" y="${h-30}" fill="#6b7684" font-size="11">${fmt(mn)}</text></svg>`}
function outcomes(entries){const done=entries.filter(e=>e.return5d!=null);const avg=k=>done.length?done.reduce((a,e)=>a+Number(e[k]),0)/done.length:null;const win=k=>done.length?done.filter(e=>Number(e[k])>0).length/done.length*100:null;return{count:entries.length,avg5:avg('return5d'),avg20:avg('return20d'),win5:win('return5d')}}
async function load(){const code=new URLSearchParams(location.search).get('code');if(!code){app.innerHTML='종목 코드가 없습니다.';return}const [sr,nr,hr,tr,mr,gr]=await Promise.all([fetch('data/stocks.json?ts='+Date.now()),fetch('data/news.json?ts='+Date.now()),fetch('data/score_history.json?ts='+Date.now()),fetch('data/timing_history.json?ts='+Date.now()),fetch('data/macro.json?ts='+Date.now()),fetch('data/geopolitical.json?ts='+Date.now())]);const stocks=await sr.json(),news=nr.ok?await nr.json():{},history=hr.ok?await hr.json():{days:[]},timing=tr.ok?await tr.json():{entries:[]},macro=mr.ok?await mr.json():null,geo=gr.ok?await gr.json():null;const marketPrices=(history?.days||[]).map(d=>Number(d.kospiPrice)).filter(v=>Number.isFinite(v)&&v>0);const s=stocks.stocks.find(x=>x.code===code);if(!s){app.innerHTML='종목을 찾을 수 없습니다.';return}const n=news[s.name],map=getMap(history),a=v42(s,map,marketPrices),arr=map[code]||[], entries=(timing.entries||[]).filter(e=>e.code===code).sort((x,y)=>y.date.localeCompare(x.date));document.getElementById('naver').href=`https://finance.naver.com/item/main.naver?code=${code}`;const scoreParts=[];if(s.targetPrice||s.opinion)scoreParts.push(`목표 ${fmt(s.targetPrice)}${s.opinion?' · '+s.opinion:''}`);if(s.debtRatio!=null)scoreParts.push(`부채비율 ${Number(s.debtRatio).toFixed(0)}%`);if(s.roe!=null)scoreParts.push(`ROE ${Number(s.roe).toFixed(1)}%`);const st=entries.length?outcomes(entries):null;app.innerHTML=`<a class="back" href="index.html">← 관심종목으로 돌아가기</a><div class="card hero"><div><div class="name">${s.name}</div><div class="code">${s.code} · ${s.sector||'기타'}</div><div class="badge ${a.cls}">${a.status==='관심'?'🟢':a.status==='관찰'?'🟡':'🔴'} V4-2 ${a.status}</div></div><div><div class="price">${fmt(s.price)}</div><div class="change ${Number(s.changeRate)>0?'up':Number(s.changeRate)<0?'down':'flat'}">${pct(Number(s.changeRate))}</div></div></div><div class="card"><div class="section-title"><span class="num">②-1</span>현재 분석</div><div class="grid"><div class="metric"><span>기존 평가점수</span><strong>${score(s,n,macro,geo)==null?'-':Math.round(score(s,n,macro,geo))+'점'}</strong></div><div class="metric"><span>52주 고점 대비</span><strong>${pct(a.highDrop)}</strong></div><div class="metric"><span>최근 5일</span><strong>${pct(a.r5)}</strong></div><div class="metric"><span>최근 20일</span><strong>${pct(a.r20)}</strong></div></div><div class="small" style="margin-top:10px">${scoreParts.join(' · ')||'목표가/재무 데이터가 없는 종목입니다.'}</div></div><div class="card"><div class="section-title"><span class="num">②-2</span>V4-2 판정 근거 · 5개 질문</div><div class="checks"><div class="check"><div class="q">① 단기 모멘텀이 살아나는가?</div>${qmark(a.q1)}</div><div class="check"><div class="q">② 중기 추세가 개선되고 있는가?</div>${qmark(a.q2)}</div><div class="check"><div class="q">③ 하락이 멈추고 반전 신호가 나타나는가?</div>${qmark(a.q3)}</div><div class="check"><div class="q">④ 가격 변동성이 줄어들고 있는가?</div>${qmark(a.q4)}</div><div class="check"><div class="q">⑤ KOSPI 대비 상대적으로 강한가?</div>${qmark(a.q5)}</div></div><p class="reasons">현재 패턴: <b>${a.pattern}</b> · V4-2 <b>${a.trueCount}/5 충족${(5-a.knownCount)>0?` · ${5-a.knownCount}개 데이터 부족`:''}</b><br>5일 ${pct(a.r5)} · 20일 ${pct(a.r20)} · KOSPI 5일 ${pct(a.marketR5)}<br>변동성 최근 ${a.vol5==null?'-':a.vol5.toFixed(2)+'%'} · 직전 ${a.prevVol5==null?'-':a.prevVol5.toFixed(2)+'%'}</p><div class="small">※ V4-2는 기존 평가점수의 재무·목표가·뉴스 항목과 분리해 가격 흐름만 관찰합니다. 5개 중 충족 항목 수로 관심/관찰/주의를 정하며, 매수·매도 추천이 아닙니다.</div></div><div class="card"><div class="section-title"><span class="num">②-3</span>가격 흐름</div>${svgChart(arr.slice(-60))}<div class="legend">최근 기록 ${arr.length}거래일 · 60개까지 표시</div></div><div class="card"><div class="section-title"><span class="num">②-4</span>자동 기록 · 같은 패턴의 실제 결과</div>${entries.length?`<div class="table-wrap"><table class="history"><thead><tr><th>판정일</th><th>당시 상태</th><th>패턴</th><th>기준가격</th><th>1일</th><th>5일</th><th>20일</th></tr></thead><tbody>${entries.map(e=>`<tr><td>${e.date}</td><td>${e.status}</td><td>${e.pattern}</td><td>${fmt(e.price)}</td><td>${pct(e.return1d)}</td><td>${pct(e.return5d)}</td><td>${pct(e.return20d)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="small">아직 자동 기록이 없습니다. GitHub Actions가 실행되면서 하루 1건씩 쌓입니다.</div>'}</div><div class="card"><div class="section-title"><span class="num">②-5</span>패턴 성과</div>${st?`<div class="stats"><div class="metric"><span>발생 횟수</span><strong>${st.count}회</strong></div><div class="metric"><span>평균 5일 수익률</span><strong>${pct(st.avg5)}</strong></div><div class="metric"><span>평균 20일 수익률</span><strong>${pct(st.avg20)}</strong></div><div class="metric"><span>5일 양수 비율</span><strong>${st.win5==null?'-':st.win5.toFixed(0)+'%'}</strong></div></div><p class="small" style="margin-top:10px">표본이 적을 때는 결과가 크게 흔들릴 수 있습니다. 우선 기록을 쌓고 이후 패턴별 성과를 비교합니다.</p>`:'<div class="small">성과를 계산할 기록이 아직 없습니다.</div>'}</div>`}
load().catch(e=>{console.error(e);app.innerHTML='데이터를 불러오지 못했습니다.'});
</script></body></html>
