<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>관심종목 모니터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0e11;
    --panel: #12161c;
    --panel-hover: #171c24;
    --line: #1f2530;
    --line-strong: #2a3140;
    --text: #e8eaed;
    --muted: #6b7684;
    --up: #f04452;      /* 한국식: 상승 = 빨강 */
    --down: #3182f6;    /* 한국식: 하락 = 파랑 */
    --flat: #6b7684;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 26px 32px 18px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: rgba(11,14,17,0.92);
    backdrop-filter: blur(8px);
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 22px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  #meta {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 14px;
    align-items: center;
  }
  #meta button {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: inherit;
    font-size: 11px;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
  }
  #meta button:hover { background: var(--panel-hover); border-color: var(--line-strong); }

  main {
    max-width: 1360px;
    margin: 0 auto;
    padding: 28px 32px 80px;
  }

  .v41-summary {
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--panel);
    padding: 12px 14px;
    font-size: 10px;
  }
  .v41-summary-head { display:flex; justify-content:space-between; gap:10px; align-items:center; margin-bottom:7px; }
  .v41-summary-title { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12px; }
  .v41-summary-note { color:var(--muted); }
  .v41-chips { display:flex; flex-wrap:wrap; gap:6px; }
  .v41-chip { border:1px solid var(--line-strong); border-radius:5px; padding:4px 7px; color:var(--muted); }
  .v41-chip strong { color:var(--text); }

  #sectors {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 20px;
  }

  .sector-card {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    overflow: hidden;
  }
  .sector-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }
  .sector-name {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.02em;
    color: var(--text);
  }
  .sector-avg { font-size: 12px; font-weight: 700; }

  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  }
  .tile {
    padding: 12px 14px;
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background 0.12s ease;
  }
  .tile:hover { background: var(--panel-hover); }
  .tile-name {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 6px;
  }
  .tile-price { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
  .tile-change { font-size: 12px; font-weight: 700; }

  .up { color: var(--up); }
  .down { color: var(--down); }
  .flat { color: var(--flat); }

  .score-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
    margin-bottom: 7px;
  }
  .score-badge.s-pos { background: rgba(240,68,82,0.15); color: var(--up); }
  .score-badge.s-mid { background: rgba(107,118,132,0.18); color: var(--muted); }
  .score-badge.s-neg { background: rgba(49,130,246,0.15); color: var(--down); }

  .v41-wrap {
    margin-top: 9px;
    padding: 8px 9px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: rgba(255,255,255,0.015);
  }
  .v41-head { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px; }
  .v41-title { font-size:9px; color:var(--muted); letter-spacing:.02em; }
  .v41-pattern { font-size:9px; font-weight:700; padding:2px 5px; border-radius:4px; border:1px solid var(--line-strong); }
  .v41-pattern.good { color:var(--up); border-color:rgba(240,68,82,.35); }
  .v41-pattern.warn { color:#d99a2b; border-color:rgba(217,154,43,.35); }
  .v41-pattern.bad { color:var(--down); border-color:rgba(49,130,246,.35); }
  .v41-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:5px 10px; }
  .v41-item { font-size:9.5px; color:var(--muted); white-space:nowrap; }
  .v41-item strong { color:var(--text); font-weight:700; }
  .v41-note { margin-top:5px; font-size:8.5px; color:var(--muted); line-height:1.35; }
  .trend-up { color:var(--up) !important; }
  .trend-down { color:var(--down) !important; }
  .trend-flat { color:var(--muted) !important; }
  .range-wrap { margin-top: 8px; }
  .range-labels {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    color: var(--muted);
    margin-bottom: 3px;
  }
  .range-track {
    position: relative;
    height: 4px;
    border-radius: 2px;
    background: var(--line);
  }
  .range-dot {
    position: absolute;
    top: 50%;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text);
    transform: translate(-50%, -50%);
  }

  .extra-line {
    margin-top: 7px;
    font-size: 10px;
    color: var(--muted);
  }

  #geo-banner {
    font-size: 12px;
    font-weight: 500;
    border-radius: 8px;
    padding: 10px 14px;
  }
  #geo-banner.down { background: rgba(240,68,82,0.1); border: 1px solid rgba(240,68,82,0.3); color: var(--up); }
  #geo-banner.up { background: rgba(49,130,246,0.1); border: 1px solid rgba(49,130,246,0.3); color: var(--down); }

  #macro {
    max-width: 1360px;
    margin: 0 auto;
    padding: 16px 32px 0;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
  }
  .macro-item {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    background: var(--panel);
  }
  .macro-label { font-size: 10px; color: var(--muted); margin-bottom: 3px; }
  .macro-price { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700; }
  .macro-change { font-size: 11px; margin-top: 2px; }

  .flow-line {
    margin-top: 6px;
    font-size: 10px;
    color: var(--muted);
  }
  .flow-line .surge { color: var(--up); font-weight: 700; }

  #disclaimer {
    font-size: 11px;
    color: var(--muted);
    max-width: 1360px;
    margin: 0 auto 18px;
    padding: 0 32px;
  }

  .heat-bar {
    margin-top: 8px;
    height: 3px;
    border-radius: 2px;
    background: var(--line);
    overflow: hidden;
  }
  .heat-bar-fill { height: 100%; }

  .news-line {
    margin-top: 9px;
    padding-top: 8px;
    border-top: 1px solid var(--line);
    font-size: 10.5px;
    line-height: 1.5;
  }
  .news-line.empty { color: var(--muted); }
  .news-line.important { color: var(--text); }
  .news-badge {
    display: inline-block;
    font-size: 9.5px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 4px;
    margin-bottom: 4px;
  }
  .news-badge.up { background: rgba(240,68,82,0.15); color: var(--up); }
  .news-badge.down { background: rgba(49,130,246,0.15); color: var(--down); }

  #empty {
    color: var(--muted);
    font-size: 13px;
    padding: 60px 8px;
    text-align: center;
  }

  .v42-summary{border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:12px 14px;font-size:10px;margin-bottom:18px}
  .v42-summary-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:7px}
  .v42-summary-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12px}
  .v42-summary-note{color:var(--muted)}
  .v42-chips{display:flex;flex-wrap:wrap;gap:6px}
  .v42-chip{border:1px solid var(--line-strong);border-radius:5px;padding:4px 7px;color:var(--muted)}
  .v42-chip strong{color:var(--text)}
  .v42-badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-strong);border-radius:999px;padding:3px 7px;font-size:10px;margin-bottom:7px}
  .v42-badge.good{color:#72d6a5;border-color:#245b44}.v42-badge.warn{color:#e6c36a;border-color:#67552a}.v42-badge.bad{color:#ff7b84;border-color:#6d3037}
  .tile{cursor:pointer}
  .tile .tile-name{cursor:pointer}

</style>
</head>
<body>

<header>
  <h1>관심종목 모니터</h1>
  <div id="meta">
    <span id="updated">불러오는 중…</span>
    <a href="backtest.html" style="color:var(--muted); font-size:11px; text-decoration:none; border:1px solid var(--line); padding:6px 12px; border-radius:6px;">백테스트 기록</a>
    <a href="score-history.html" style="color:var(--muted); font-size:11px; text-decoration:none; border:1px solid var(--line); padding:6px 12px; border-radius:6px;">일별 점수 기록</a>
    <a href="performance.html" style="color:var(--muted); font-size:11px; text-decoration:none; border:1px solid var(--line); padding:6px 12px; border-radius:6px;">V4-3 과거 성과</a>
    <button onclick="load()">새로고침</button>
  </div>
</header>

<div id="earnings-banner" style="max-width:1360px; margin:14px auto 0; padding:8px 32px; font-size:11px; color:var(--muted);"></div>
<div id="geo-banner" style="display:none; max-width:1360px; margin:8px auto 0; padding:10px 32px;"></div>
<div id="macro"></div>

<main>
  <p id="disclaimer">평가점수 = 목표주가 상승여력(30%)·투자의견(20%)·52주 위치(15%)·뉴스/공시 영향(15%)·재무제표(10%)·공매도 비중(10%)의
  가중합에, 환율(±5)·미증시(±5)·지정학적 리스크(±4)·VIX(±3)·미국10년물(±2)을 중요도에 따라 차등 반영해 조정한
  참고용 지표입니다(매크로 조정 최대 ±19점). 매수/매도 추천이 아닙니다.</p>
  <div id="v41-summary" class="v41-summary" style="margin-bottom:18px; display:none;"></div>
  <div id="v42-summary" class="v42-summary" style="display:none;"></div>

  <div id="sectors"></div>
  <div id="empty" style="display:none">아직 데이터가 없어요. GitHub Actions가 처음 실행되면 채워집니다.</div>
</main>

<script>
  const HEAT_CAP = 10; // 등락률 이 값(%) 이상이면 히트바가 꽉 참

  // 기본 점수 가중치 (종목 자체 지표, 합계 100)
  const SCORE_WEIGHTS = { target: 0.30, opinion: 0.20, week52: 0.15, news: 0.15, financial: 0.10, shortSelling: 0.10 };
  const OPINION_SCORE = { "강력매수": 100, "매수": 80, "중립": 50, "매도": 20, "강력매도": 0 };
  // 매크로 조정치 (시장 전체 공통, 각각 최대 ±20점씩 가감 후 합산)
  // 매크로 조정치는 MACRO_WEIGHTS(요소별 차등 가중치)로 계산됨

  function computeBaseScore(s, newsInfo) {
    const parts = [];

    if (s.targetPrice) {
      const upsidePct = (s.targetPrice / s.price - 1) * 100;
      const sc = Math.max(0, Math.min(100, (upsidePct / 50) * 100));
      parts.push([sc, SCORE_WEIGHTS.target]);
    }
    if (s.opinion && OPINION_SCORE[s.opinion] !== undefined) {
      parts.push([OPINION_SCORE[s.opinion], SCORE_WEIGHTS.opinion]);
    }
    if (s.week52High && s.week52Low && s.week52High > s.week52Low) {
      const pos = (s.price - s.week52Low) / (s.week52High - s.week52Low) * 100;
      // 52주 저점에 가까울수록 높은 점수(저평가 관점)
      parts.push([Math.max(0, Math.min(100, 100 - pos)), SCORE_WEIGHTS.week52]);
    }

    let newsScore = 50;
    if (newsInfo && newsInfo.hasImportantNews) {
      const impact = newsInfo.impactPct || 0;
      newsScore = newsInfo.direction === 'down'
        ? Math.max(0, 50 - impact / 2)
        : Math.min(100, 50 + impact / 2);
    }
    parts.push([newsScore, SCORE_WEIGHTS.news]);

    // 재무제표: 부채비율은 낮을수록, ROE는 높을수록 좋게 평가 (둘 다 있으면 평균)
    const finParts = [];
    if (s.debtRatio != null) finParts.push(Math.max(0, Math.min(100, 100 - s.debtRatio / 2)));
    if (s.roe != null) finParts.push(Math.max(0, Math.min(100, s.roe * 5)));
    if (finParts.length > 0) {
      const finScore = finParts.reduce((a, b) => a + b, 0) / finParts.length;
      parts.push([finScore, SCORE_WEIGHTS.financial]);
    }

    // 공매도 비중: 높을수록 하락 베팅이 많다는 뜻이라 감점 (비중 10%면 0점에 수렴)
    if (s.shortSellingRatio != null) {
      const shortScore = Math.max(0, Math.min(100, 100 - s.shortSellingRatio * 10));
      parts.push([shortScore, SCORE_WEIGHTS.shortSelling]);
    }

    const totalWeight = parts.reduce((sum, [, w]) => sum + w, 0);
    const weighted = parts.reduce((sum, [sc, w]) => sum + sc * w, 0);
    return totalWeight > 0 ? weighted / totalWeight : null;
  }

  // 매크로 요소별 최대 조정폭 (중요도 차등, 합계 ±19점)
  const MACRO_WEIGHTS = { usdkrw: 5, nasdaq: 5, geo: 4, vix: 3, us10y: 2 };

  function computeMacroAdjustment(macro, geo) {
    let adj = 0;

    // 환율: 원화 강세(환율 하락) → +5, 원화 약세(환율 상승) → -5
    if (macro && macro.usdkrw && macro.usdkrw.changeRate != null) {
      const w = MACRO_WEIGHTS.usdkrw;
      adj += macro.usdkrw.changeRate < 0 ? w : macro.usdkrw.changeRate > 0 ? -w : 0;
    }
    // 미국 증시(나스닥): 상승 → +5, 하락 → -5
    if (macro && macro.nasdaq && macro.nasdaq.changeRate != null) {
      const w = MACRO_WEIGHTS.nasdaq;
      adj += macro.nasdaq.changeRate > 0 ? w : macro.nasdaq.changeRate < 0 ? -w : 0;
    }
    // 미국-이란 전쟁 리스크: 악재(확전) → -4, 호재(완화) → +4
    if (geo && geo.hasRisk) {
      const w = MACRO_WEIGHTS.geo;
      adj += geo.direction === 'down' ? -w : geo.direction === 'up' ? w : 0;
    }
    // VIX(미국 변동성지수): 상승(불안 심화) → -3, 하락(안정) → +3
    if (macro && macro.vix && macro.vix.changeRate != null) {
      const w = MACRO_WEIGHTS.vix;
      adj += macro.vix.changeRate > 0 ? -w : macro.vix.changeRate < 0 ? w : 0;
    }
    // 미국 10년물 국채금리: 상승(할인율 부담) → -2, 하락(부담 완화) → +2
    if (macro && macro.us10y && macro.us10y.changeRate != null) {
      const w = MACRO_WEIGHTS.us10y;
      adj += macro.us10y.changeRate > 0 ? -w : macro.us10y.changeRate < 0 ? w : 0;
    }

    return adj;
  }

  function computeScore(s, newsInfo, macro, geo) {
    const base = computeBaseScore(s, newsInfo);
    if (base === null) return null;
    const adj = computeMacroAdjustment(macro, geo);
    return Math.max(0, Math.min(100, base + adj));
  }

  function scoreClass(score) {
    if (score >= 60) return 's-pos';
    if (score >= 40) return 's-mid';
    return 's-neg';
  }

  function scoreLabel(score) {
    if (score >= 70) return '긍정적';
    if (score >= 55) return '다소 긍정';
    if (score >= 45) return '중립';
    if (score >= 30) return '다소 부정';
    return '부정적';
  }

  // V4-1: 가격 위치 + 최근 추세 분석
  // score_history.json의 일별 종가 기록을 이용합니다.
  const V41_SIDEWAYS_5D = 2.0;
  const V41_SIDEWAYS_20D = 5.0;

  function signedPct(v) {
    if (v == null || !Number.isFinite(v)) return '-';
    return `${v > 0 ? '+' : ''}${v.toFixed(1)}%`;
  }

  function getHistoryMap(history) {
    const map = {};
    if (!history || !Array.isArray(history.days)) return map;
    for (const day of history.days) {
      for (const s of (day.stocks || [])) {
        if (!map[s.code]) map[s.code] = [];
        if (Number.isFinite(Number(s.price))) map[s.code].push({ date: day.date, price: Number(s.price) });
      }
    }
    for (const code of Object.keys(map)) map[code].sort((a,b) => a.date.localeCompare(b.date));
    return map;
  }

  function calcV41(s, historyMap) {
    const high = Number(s.week52High), low = Number(s.week52Low), price = Number(s.price);
    const result = { highDrop:null, lowRise:null, pos:null, r5:null, r20:null,
      state5:'데이터 부족', state20:'데이터 부족', pattern:'관찰', patternClass:'warn' };

    if (Number.isFinite(high) && high > 0 && Number.isFinite(price)) result.highDrop = (price / high - 1) * 100;
    if (Number.isFinite(low) && low > 0 && Number.isFinite(price)) result.lowRise = (price / low - 1) * 100;
    if (Number.isFinite(high) && Number.isFinite(low) && high > low && Number.isFinite(price))
      result.pos = Math.max(0, Math.min(100, (price-low)/(high-low)*100));

    const arr = historyMap[s.code] || [];
    if (arr.length >= 6) {
      const latest = arr[arr.length-1].price, p5 = arr[arr.length-6].price;
      if (p5 > 0) result.r5 = (latest/p5-1)*100;
    }
    if (arr.length >= 21) {
      const latest = arr[arr.length-1].price, p20 = arr[arr.length-21].price;
      if (p20 > 0) result.r20 = (latest/p20-1)*100;
    }

    const state = (r,t) => r == null ? '데이터 부족' : Math.abs(r) <= t ? '횡보' : r > 0 ? '상승' : '하락';
    result.state5 = state(result.r5, V41_SIDEWAYS_5D);
    result.state20 = state(result.r20, V41_SIDEWAYS_20D);

    if (result.highDrop != null && result.highDrop > -10 && result.r5 != null && result.r5 > 3) {
      result.pattern='고점 추격 주의'; result.patternClass='bad';
    } else if (result.highDrop != null && result.highDrop <= -15 && result.r20 != null && result.r20 < 0 &&
               result.r5 != null && Math.abs(result.r5) <= V41_SIDEWAYS_5D) {
      result.pattern='조정 후 횡보'; result.patternClass='good';
    } else if (result.r5 != null && result.r20 != null && result.r5 > 0 && result.r20 > 0) {
      result.pattern='상승 추세'; result.patternClass='good';
    } else if (result.r5 != null && result.r20 != null && result.r5 < -3 && result.r20 < -5) {
      result.pattern='하락 추세'; result.patternClass='bad';
    } else if (result.r5 != null && Math.abs(result.r5) <= V41_SIDEWAYS_5D) {
      result.pattern='단기 횡보'; result.patternClass='warn';
    }
    return result;
  }

  // V4-2: 가격 타이밍 참고판정. 숫자 점수는 만들지 않고 관심/관찰/주의로만 표시합니다.
  function calcFinancialOkay(s) {
    const debt = Number(s.debtRatio), roe = Number(s.roe);
    if (!Number.isFinite(debt) && !Number.isFinite(roe)) return null;
    const parts=[];
    if (Number.isFinite(debt)) parts.push(Math.max(0, Math.min(100, 100 - debt/2)));
    if (Number.isFinite(roe)) parts.push(Math.max(0, Math.min(100, roe*5)));
    const score=parts.reduce((a,b)=>a+b,0)/parts.length;
    return score>=60;
  }

  function calcV42(s, historyMap, newsInfo) {
    const v=calcV41(s,historyMap), checks=[], reasons=[];
    const q1=v.highDrop==null ? null : v.highDrop<=-10;
    const q2=v.r20==null ? null : v.r20>-10;
    const q3=v.r5==null ? null : v.r5>=-2;
    const q4=calcFinancialOkay(s);
    let q5=null;
    const upside=(s.targetPrice&&s.price)?(Number(s.targetPrice)/Number(s.price)-1)*100:null;
    const targetGood=upside!=null ? upside>=10 : (s.opinion==='매수'||s.opinion==='강력매수');
    const newsBad=!!(newsInfo&&newsInfo.hasImportantNews&&newsInfo.direction==='down'&&(Number(newsInfo.impactPct)||0)>=5);
    if (upside!=null || s.opinion || newsInfo) q5=!!targetGood && !newsBad;
    checks.push(q1,q2,q3,q4,q5);
    if(q1===true) reasons.push('52주 고점에서 10% 이상 조정'); else if(q1===false) reasons.push('52주 고점과 가까움'); else reasons.push('52주 위치 데이터 부족');
    if(q2===true) reasons.push('20일 급락은 아님'); else if(q2===false) reasons.push('20일 하락폭이 큼'); else reasons.push('20일 추세 데이터 부족');
    if(q3===true) reasons.push('최근 5일 하락이 멈춤'); else if(q3===false) reasons.push('최근 5일도 하락 중'); else reasons.push('5일 추세 데이터 부족');
    if(q4===true) reasons.push('재무 상태 양호'); else if(q4===false) reasons.push('재무 지표 주의'); else reasons.push('재무 데이터 부족');
    if(q5===true) reasons.push('목표가/의견·뉴스 긍정'); else if(q5===false) reasons.push('목표가/의견·뉴스 확인 필요'); else reasons.push('목표가·뉴스 데이터 부족');

    let status='관찰', statusClass='warn';
    if(v.pattern==='고점 추격 주의' || v.pattern==='하락 추세' || q2===false || q3===false) { status='주의'; statusClass='bad'; }
    else if(q1===true && q2!==false && q3===true && q4!==false && q5!==false) { status='관심'; statusClass='good'; }
    return {v,q1,q2,q3,q4,q5,status,statusClass,reasons,upside};
  }

  function renderV42(s,historyMap,newsInfo){
    const a=calcV42(s,historyMap,newsInfo);
    return `<div class="v42-badge ${a.statusClass}">${a.status==='관심'?'🟢':a.status==='관찰'?'🟡':'🔴'} V4-2 ${a.status}</div>`;
  }

  function renderV42Summary(data,historyMap,news){
    const el=document.getElementById('v42-summary'); if(!el)return;
    const items=data.stocks.map(s=>calcV42(s,historyMap,news[s.name]));
    const interest=items.filter(x=>x.status==='관심').length, watch=items.filter(x=>x.status==='관찰').length, caution=items.filter(x=>x.status==='주의').length;
    el.style.display='block';
    el.innerHTML=`<div class="v42-summary-head"><span class="v42-summary-title">V4-2 가격 타이밍 참고판정</span><span class="v42-summary-note">종목 자체 평가점수와 별개 · 매수/매도 신호 아님</span></div><div class="v42-chips"><span class="v42-chip">🟢 관심 <strong>${interest}</strong></span><span class="v42-chip">🟡 관찰 <strong>${watch}</strong></span><span class="v42-chip">🔴 주의 <strong>${caution}</strong></span></div>`;
  }

  function renderV41(s, historyMap) {
    const v = calcV41(s, historyMap);
    const highText = v.highDrop == null ? '-' : `${v.highDrop.toFixed(1)}%`;
    const posText = v.pos == null ? '-' : `${v.pos.toFixed(0)}%`;
    const r5Text = signedPct(v.r5), r20Text = signedPct(v.r20);
    const c5 = v.state5==='상승' ? 'trend-up' : v.state5==='하락' ? 'trend-down' : 'trend-flat';
    const c20 = v.state20==='상승' ? 'trend-up' : v.state20==='하락' ? 'trend-down' : 'trend-flat';
    return `
      <div class="v41-wrap">
        <div class="v41-head">
          <span class="v41-title">V4-1 가격 위치 · 단기 추세</span>
          <span class="v41-pattern ${v.patternClass}">${v.pattern}</span>
        </div>
        <div class="v41-grid">
          <div class="v41-item">52주 고점 대비 <strong>${highText}</strong></div>
          <div class="v41-item">52주 범위 위치 <strong>${posText}</strong></div>
          <div class="v41-item">최근 5일 <strong class="${c5}">${r5Text}</strong> · ${v.state5}</div>
          <div class="v41-item">최근 20일 <strong class="${c20}">${r20Text}</strong> · ${v.state20}</div>
        </div>
        <div class="v41-note">최근 5일 ±2%를 횡보, 최근 20일 ±5%를 횡보로 표시합니다. V4-1은 매수·매도 신호가 아닌 가격 흐름 참고용입니다.</div>
      </div>`;
  }

  function renderV41Summary(data, historyMap) {
    const el = document.getElementById('v41-summary');
    if (!el) return;
    const items = data.stocks.map(s => ({s, v:calcV41(s, historyMap)}));
    const adjusted = items.filter(x=>x.v.pattern==='조정 후 횡보').length;
    const chase = items.filter(x=>x.v.pattern==='고점 추격 주의').length;
    const sideways = items.filter(x=>x.v.state5==='횡보').length;
    const enough = items.filter(x=>x.v.r20!=null).length;
    el.style.display='block';
    el.innerHTML=`<div class="v41-summary-head"><span class="v41-summary-title">V4-1 가격·추세 요약</span><span class="v41-summary-note">현재 ${data.stocks.length}종목 · 20일 데이터 확보 ${enough}종목</span></div>
      <div class="v41-chips"><span class="v41-chip">🟢 조정 후 횡보 <strong>${adjusted}</strong></span><span class="v41-chip">⚠️ 고점 추격 주의 <strong>${chase}</strong></span><span class="v41-chip">↔ 최근 5일 횡보 <strong>${sideways}</strong></span></div>`;
  }

  async function load() {
    try {
      const [stocksRes, newsRes, macroRes, geoRes, historyRes] = await Promise.all([
        fetch('data/stocks.json?ts=' + Date.now()),
        fetch('data/news.json?ts=' + Date.now()).catch(() => null),
        fetch('data/macro.json?ts=' + Date.now()).catch(() => null),
        fetch('data/geopolitical.json?ts=' + Date.now()).catch(() => null),
        fetch('data/score_history.json?ts=' + Date.now()).catch(() => null),
      ]);
      if (!stocksRes.ok) throw new Error('no data yet');
      const data = await stocksRes.json();
      const news = (newsRes && newsRes.ok) ? await newsRes.json() : {};
      const macro = (macroRes && macroRes.ok) ? await macroRes.json() : null;
      const geo = (geoRes && geoRes.ok) ? await geoRes.json() : null;
      const history = (historyRes && historyRes.ok) ? await historyRes.json() : null;
      const historyMap = getHistoryMap(history);
      if (macro) renderMacro(macro);
      renderEarningsBanner(macro);
      renderGeoBanner(geo);
      renderV41Summary(data, historyMap);
      renderV42Summary(data, historyMap, news);
      render(data, news, macro, geo, historyMap);
    } catch (e) {
      document.getElementById('empty').style.display = 'block';
      document.getElementById('updated').textContent = '데이터 없음';
    }
  }

  function renderGeoBanner(geo) {
    const el = document.getElementById('geo-banner');
    if (!el) return;
    if (geo && geo.hasRisk) {
      const dir = geo.direction === 'down' ? 'down' : 'up';
      el.style.display = 'block';
      el.className = dir;
      el.textContent = `⚠️ 미국-이란 지정학적 리스크 감지 (${dir === 'down' ? '악재' : '호재'} 반영) — ${geo.summary}`;
    } else {
      el.style.display = 'none';
    }
  }

  const MACRO_LABELS = {
    kospi: '코스피', kosdaq: '코스닥',
    usdkrw: '원/달러', nasdaq: '나스닥', sox: 'SOX(반도체)',
    vix: 'VIX', us10y: '미국10년물(%)',
  };

  function renderEarningsBanner(macro) {
    const el = document.getElementById('earnings-banner');
    if (!el) return;
    if (!macro || !macro.nextEarningsEstimate) {
      el.textContent = '';
      return;
    }
    const target = new Date(macro.nextEarningsEstimate + 'T00:00:00+09:00');
    const now = new Date();
    const dday = Math.ceil((target - now) / (1000 * 60 * 60 * 24));
    const dateStr = target.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric' });
    el.textContent = `📅 다음 분기 실적발표 예상: ${dateStr} 경 (D-${dday}) — 법정 제출기한 기준 추정치이며 종목별 실제 발표일과 다를 수 있어요`;
  }

  function renderMacro(macro) {
    const el = document.getElementById('macro');
    el.innerHTML = Object.keys(MACRO_LABELS).map(key => {
      const m = macro[key];
      if (!m || m.price == null) {
        return `<div class="macro-item"><div class="macro-label">${MACRO_LABELS[key]}</div><div class="macro-price" style="color:var(--muted)">-</div></div>`;
      }
      const dir = dirOf(m.changeRate || 0);
      const sign = (m.changeRate || 0) > 0 ? '+' : '';
      return `
        <div class="macro-item">
          <div class="macro-label">${MACRO_LABELS[key]}</div>
          <div class="macro-price">${m.price.toLocaleString('ko-KR')}</div>
          <div class="macro-change ${dir}">${sign}${(m.changeRate || 0).toFixed(2)}%</div>
        </div>`;
    }).join('');
  }

  function dirOf(rate) {
    return rate > 0 ? 'up' : rate < 0 ? 'down' : 'flat';
  }

  function render(data, news, macro, geo, historyMap) {
    document.getElementById('updated').textContent =
      '업데이트: ' + new Date(data.updatedAt).toLocaleString('ko-KR', { hour12: false });

    // 섹터별로 묶기
    const bySector = {};
    for (const s of data.stocks) {
      const sector = s.sector || '기타';
      (bySector[sector] ||= []).push(s);
    }

    // 섹터 내부는 등락률 높은 순, 섹터 자체는 평균 등락률 높은 순
    const sectorNames = Object.keys(bySector).sort((a, b) => {
      const avg = arr => arr.reduce((sum, s) => sum + (parseFloat(s.changeRate) || 0), 0) / arr.length;
      return avg(bySector[b]) - avg(bySector[a]);
    });

    const container = document.getElementById('sectors');
    container.innerHTML = sectorNames.map(sector => {
      const stocks = [...bySector[sector]].sort(
        (a, b) => (parseFloat(b.changeRate) || 0) - (parseFloat(a.changeRate) || 0)
      );
      const avgRate = stocks.reduce((sum, s) => sum + (parseFloat(s.changeRate) || 0), 0) / stocks.length;
      const avgDir = dirOf(avgRate);

      const tiles = stocks.map(s => {
        const rate = parseFloat(s.changeRate) || 0;
        const dir = dirOf(rate);
        const heatPct = Math.min(Math.abs(rate) / HEAT_CAP, 1) * 100;
        const sign = rate > 0 ? '+' : '';

        const n = news[s.name];
        let newsHtml;
        if (n && n.hasImportantNews) {
          const badgeDir = n.direction === 'down' ? 'down' : 'up';
          const badgeSign = n.direction === 'down' ? '-' : '+';
          const sourceTag = n.source === '공시' ? '📄 공시' : '📰 뉴스';
          const dateTag = n.date ? ` · ${n.date}` : '';
          newsHtml = `
            <div class="news-line important">
              <span class="news-badge ${badgeDir}">영향도 ${badgeSign}${Math.round(n.impactPct)}%</span>
              <span style="color:var(--muted); font-size:9.5px;">${sourceTag}${dateTag}</span><br/>
              ${n.summary}
            </div>`;
        } else {
          newsHtml = `<div class="news-line empty">최근 3일 내 특이 뉴스/공시 없음</div>`;
        }

        const score = computeScore(s, n, macro, geo);
        const scoreHtml = score !== null
          ? `<div class="score-badge ${scoreClass(score)}">${Math.round(score)}점 · ${scoreLabel(score)}</div>`
          : '';

        let extraHtml = '';
        if (s.targetPrice || s.opinion) {
          extraHtml += `<div class="extra-line">`;
          if (s.opinion) extraHtml += `투자의견 ${s.opinion}`;
          if (s.targetPrice) extraHtml += `${s.opinion ? ' · ' : ''}목표 ${Number(s.targetPrice).toLocaleString('ko-KR')}`;
          extraHtml += `</div>`;
        }

        let rangeHtml = '';
        if (s.week52High && s.week52Low && s.week52High > s.week52Low) {
          const pos = Math.max(0, Math.min(100, (s.price - s.week52Low) / (s.week52High - s.week52Low) * 100));
          rangeHtml = `
            <div class="range-wrap">
              <div class="range-labels"><span>52주저 ${Number(s.week52Low).toLocaleString('ko-KR')}</span><span>52주고 ${Number(s.week52High).toLocaleString('ko-KR')}</span></div>
              <div class="range-track"><div class="range-dot" style="left:${pos}%"></div></div>
            </div>`;
        }

        const v41Html = renderV41(s, historyMap || {});
        const v42Html = renderV42(s, historyMap || {}, n);

        let supportHtml = '';
        if (s.supportLine) {
          supportHtml = `<div class="extra-line">지지선(20일 저가) ${Number(s.supportLine).toLocaleString('ko-KR')}</div>`;
        }

        let finHtml = '';
        if (s.debtRatio != null || s.roe != null) {
          const bits = [];
          if (s.debtRatio != null) bits.push(`부채비율 ${s.debtRatio.toFixed(0)}%`);
          if (s.roe != null) bits.push(`ROE ${s.roe.toFixed(1)}%`);
          finHtml = `<div class="extra-line">${bits.join(' · ')}</div>`;
        }

        let flowHtml = '';
        if (s.volumeRatio || s.foreignNet != null || s.instNet != null || s.indivNet != null || s.shortSellingRatio != null) {
          const bits = [];
          if (s.volumeRatio) {
            const surgeClass = s.volumeRatio >= 2 ? 'surge' : '';
            bits.push(`거래량 <span class="${surgeClass}">${s.volumeRatio.toFixed(1)}배</span>`);
          }
          if (s.foreignNet != null) {
            bits.push(`외국인 ${s.foreignNet > 0 ? '+' : ''}${(s.foreignNet / 10000).toFixed(1)}만주`);
          }
          if (s.instNet != null) {
            bits.push(`기관 ${s.instNet > 0 ? '+' : ''}${(s.instNet / 10000).toFixed(1)}만주`);
          }
          if (s.indivNet != null) {
            bits.push(`개인 ${s.indivNet > 0 ? '+' : ''}${(s.indivNet / 10000).toFixed(1)}만주(추정)`);
          }
          if (s.shortSellingRatio != null) {
            const shortClass = s.shortSellingRatio >= 5 ? 'surge' : '';
            bits.push(`공매도 <span class="${shortClass}">${s.shortSellingRatio.toFixed(1)}%</span>`);
          }
          flowHtml = `<div class="flow-line">${bits.join(' · ')}</div>`;
        }

        return `
          <div class="tile" onclick="location.href='stock.html?code=${encodeURIComponent(s.code)}'">
            ${scoreHtml}
            ${v42Html}
            <div class="tile-name">${s.name}</div>
            <div class="tile-price">${Number(s.price).toLocaleString('ko-KR')}</div>
            <div class="tile-change ${dir}">${sign}${rate.toFixed(2)}%</div>
            <div class="heat-bar"><div class="heat-bar-fill ${dir}" style="width:${heatPct}%; background:currentColor"></div></div>
            ${rangeHtml}
            ${v41Html}
            ${supportHtml}
            ${flowHtml}
            ${finHtml}
            ${extraHtml}
            ${newsHtml}
          </div>`;
      }).join('');

      return `
        <div class="sector-card">
          <div class="sector-head">
            <span class="sector-name">${sector}</span>
            <span class="sector-avg ${avgDir}">${avgRate > 0 ? '+' : ''}${avgRate.toFixed(2)}%</span>
          </div>
          <div class="tiles">${tiles}</div>
        </div>`;
    }).join('');
  }

  load();
  setInterval(load, 60000);
</script>

</body>
</html>
